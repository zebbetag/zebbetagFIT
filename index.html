<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>zebbetag Fitness</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg-0:#0B0B0C; --bg-1:#121214;
    --red:#FF2D55; --orange:#FF9500;
    --txt:#FFFFFF; --txt-2:#A1A1AA;
    --line:rgba(255,255,255,.15);
  }
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg-0); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
    overflow-x:hidden;
  }
  /* Ambient gradient blobs */
  .amb{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .amb::before,.amb::after{
    content:""; position:absolute; width:55vw; height:55vw; border-radius:50%;
    filter:blur(120px); opacity:.35;
  }
  .amb::before{ background:radial-gradient(circle,#FF2D55,transparent 70%); top:-15vw; right:-10vw; }
  .amb::after{ background:radial-gradient(circle,#FF9500,transparent 70%); bottom:-20vw; left:-15vw; opacity:.28; }

  .glass{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .glass-strong{
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(30px) saturate(160%);
    -webkit-backdrop-filter:blur(30px) saturate(160%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 12px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .grad{ background:linear-gradient(135deg,var(--red),var(--orange)); }
  .grad-text{ background:linear-gradient(135deg,var(--red),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .btn-accent{
    background:linear-gradient(135deg,var(--red),var(--orange));
    color:#fff; font-weight:600; border:none;
    box-shadow:0 6px 24px rgba(255,45,85,.35);
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn-accent:hover{ filter:brightness(1.08); box-shadow:0 8px 30px rgba(255,107,0,.45); }
  .btn-accent:active{ transform:scale(.97); }
  .btn-ghost{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:#fff;
    transition:background .2s ease, transform .12s ease;
  }
  .btn-ghost:hover{ background:rgba(255,255,255,.12); }
  .btn-ghost:active{ transform:scale(.97); }
  input,select,textarea{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:#fff;
    border-radius:14px; padding:.95rem 1rem; font-size:.95rem; outline:none; width:100%;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input::placeholder,textarea::placeholder{ color:#8b8b93; }
  input:focus,select:focus,textarea:focus{ border-color:rgba(255,149,0,.6); box-shadow:0 0 0 3px rgba(255,45,85,.18); }
  select option{ background:#161618; color:#fff; }
  label.fld{ display:block; font-size:.75rem; color:var(--txt-2); margin:0 0 .35rem .15rem; }
  .chip{
    padding:.5rem .9rem; border-radius:999px; font-size:.85rem; cursor:pointer; user-select:none;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:var(--txt-2);
    transition:all .18s ease;
  }
  .chip.active{ background:linear-gradient(135deg,var(--red),var(--orange)); color:#fff; border-color:transparent; box-shadow:0 4px 16px rgba(255,45,85,.35); }
  .tab{ color:var(--txt-2); font-weight:600; padding:.55rem .2rem; position:relative; cursor:pointer; }
  .tab.active{ color:#fff; }
  .tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-2px; height:3px; border-radius:3px; background:linear-gradient(90deg,var(--red),var(--orange)); }
  .navbtn{ display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--txt-2); font-size:.68rem; font-weight:500; padding:.35rem .9rem; border-radius:16px; cursor:pointer; transition:color .2s ease, background .2s ease; }
  .navbtn.active{ color:#fff; }
  .navbtn.active .ic{ background:linear-gradient(135deg,var(--red),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ic{ font-size:1.35rem; line-height:1; }
  .over{ color:var(--red) !important; text-shadow:0 0 12px rgba(255,45,85,.5); }
  .fade{ animation:fade .35s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  .modal-bg{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:1rem; animation:fade .2s ease; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:9px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  .hide{ display:none !important; }
  .prog-track{ height:9px; border-radius:999px; background:rgba(255,255,255,.10); overflow:hidden; }
  .prog-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--red),var(--orange)); transition:width .4s ease; }
  .chart-box{ position:relative; height:200px; }
  .dot-spin{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .warn-box{ background:rgba(255,45,85,.10); border:1px solid rgba(255,45,85,.35); border-radius:16px; padding:.9rem 1rem; font-size:.8rem; line-height:1.4; color:#ffd9e1; }
</style>
</head>
<body>
<div class="amb"></div>

<!-- ===================== AUTH ===================== -->
<div id="auth" class="relative z-10 min-h-screen flex items-center justify-center p-5">
  <div class="glass-strong w-full max-w-md rounded-3xl p-8 fade">
    <div class="flex items-center gap-3 mb-1">
      <div class="grad w-11 h-11 rounded-2xl flex items-center justify-center text-2xl shadow-lg">🔥</div>
      <div>
        <h1 class="text-2xl font-bold leading-none">zebbetag <span class="grad-text">Fitness</span></h1>
        <p class="text-xs" style="color:var(--txt-2)">Entrena. Registra. Progresa.</p>
      </div>
    </div>

  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hide relative z-10 min-h-screen">
  <!-- top bar -->
  <header class="sticky top-0 z-40 glass px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="grad w-9 h-9 rounded-xl flex items-center justify-center text-lg">🔥</div>
      <span class="font-bold text-lg">zebbetag <span class="grad-text">Fitness</span></span>
    </div>
    <div class="flex items-center gap-2">
      <span id="who" class="text-sm hidden sm:block mr-1" style="color:var(--txt-2)"></span>
      <div id="sync-badge" class="hide items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full sm:flex" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)">
        <span class="dot" style="width:8px;height:8px;border-radius:50%;background:#A1A1AA;display:inline-block"></span>
        <span class="lbl" style="color:var(--txt-2)"></span>
      </div>
      <button id="cfg-btn" class="btn-ghost rounded-xl w-9 h-9 flex items-center justify-center hide" onclick="openConfig()" title="Configuración de nube">⚙️</button>
      <button class="btn-ghost rounded-xl px-3 py-1.5 text-sm" onclick="logout()">Salir</button>
    </div>
  </header>

  <main id="content" class="max-w-3xl mx-auto px-4 pt-5 pb-32"></main>

  <!-- bottom nav -->
  <nav class="fixed bottom-0 inset-x-0 z-40 flex justify-center pb-[env(safe-area-inset-bottom)]">
    <div class="glass-strong rounded-t-3xl w-full max-w-3xl flex justify-around py-2 px-2">
      <div id="nav-train" class="navbtn active" onclick="go('train')"><span class="ic">🏋️</span>Entrenamiento</div>
      <div id="nav-nutri" class="navbtn" onclick="go('nutri')"><span class="ic">🍎</span>Nutrición</div>
      <div id="nav-ctrl" class="navbtn" onclick="go('ctrl')"><span class="ic">📊</span>Control</div>
    </div>
  </nav>
</div>

<!-- modal + report host -->
<div id="modal-root"></div>
<div id="report-host" style="position:fixed; left:-9999px; top:0;"></div>

<script>
/* ============================================================
   zebbetag Fitness — motor local sobre localStorage
   ============================================================ */
const DB_KEY = 'zebbetag_db';
const MUSCLES = ['Espalda','Bíceps','Antebrazo','Pectoral','Hombro','Tríceps','Pierna','Abdomen','Glúteo','Trapecio'];
const MACHINES = ['Caminadora','Bicicleta','Escaladora','Elíptica','Remo'];

const uid = () => 'id' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
const $ = s => document.querySelector(s);

let db = null;
let charts = {};

function loadDB(){ try{ return JSON.parse(localStorage.getItem(DB_KEY)); }catch(e){ return null; } }
function saveLocal(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function saveDB(){ saveLocal(); scheduleCloudPush(); }

/* ---------- Seed / datos mock ---------- */
function seed(){
  const u = 'demo';
  const now = new Date();
  const dOffset = n => { const x = new Date(now); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); };

  const exLib = [
    {id:uid(),userId:u,name:'Jalón al pecho',muscle:'Espalda'},
    {id:uid(),userId:u,name:'Remo con barra',muscle:'Espalda'},
    {id:uid(),userId:u,name:'Curl con barra',muscle:'Bíceps'},
    {id:uid(),userId:u,name:'Press banca',muscle:'Pectoral'},
    {id:uid(),userId:u,name:'Aperturas',muscle:'Pectoral'},
    {id:uid(),userId:u,name:'Press militar',muscle:'Hombro'},
    {id:uid(),userId:u,name:'Extensión tríceps polea',muscle:'Tríceps'},
    {id:uid(),userId:u,name:'Sentadilla',muscle:'Pierna'},
    {id:uid(),userId:u,name:'Prensa',muscle:'Pierna'},
    {id:uid(),userId:u,name:'Plancha',muscle:'Abdomen'},
  ];
  const byName = n => exLib.find(e=>e.name===n).name;

  // Las "personas" ahora son cuentas reales (ver return). Sus datos se indexan por id de cuenta: p1, p2, p3.
  const workouts = [
    // Persona 1 (Ana)
    {id:uid(),personaId:'p1',date:dOffset(8),muscles:['Pectoral','Tríceps'],cardio:{on:false},exercises:[
      {name:'Press banca',weight:60,unit:'kg',sets:4,reps:10},
      {name:'Aperturas',weight:14,unit:'kg',sets:3,reps:12},
      {name:'Extensión tríceps polea',weight:25,unit:'kg',sets:4,reps:12}]},
    {id:uid(),personaId:'p1',date:dOffset(3),muscles:['Pectoral','Tríceps'],cardio:{on:false},exercises:[
      {name:'Press banca',weight:67.5,unit:'kg',sets:4,reps:10},
      {name:'Aperturas',weight:16,unit:'kg',sets:3,reps:12},
      {name:'Extensión tríceps polea',weight:27.5,unit:'kg',sets:4,reps:12}]},
    {id:uid(),personaId:'p1',date:today(),muscles:['Espalda','Bíceps'],cardio:{on:true,time:15,incline:2,level:6,machine:'Caminadora'},exercises:[
      {name:'Jalón al pecho',weight:55,unit:'kg',sets:4,reps:12},
      {name:'Curl con barra',weight:22.5,unit:'kg',sets:3,reps:12}]},
    // Persona 2 (Beto)
    {id:uid(),personaId:'p2',date:dOffset(6),muscles:['Pierna'],cardio:{on:false},exercises:[
      {name:'Sentadilla',weight:70,unit:'kg',sets:4,reps:10},
      {name:'Prensa',weight:120,unit:'kg',sets:4,reps:12}]},
    {id:uid(),personaId:'p2',date:dOffset(1),muscles:['Pierna','Abdomen'],cardio:{on:true,time:20,incline:4,level:8,machine:'Escaladora'},exercises:[
      {name:'Sentadilla',weight:85,unit:'kg',sets:5,reps:8},
      {name:'Prensa',weight:150,unit:'kg',sets:4,reps:12},
      {name:'Plancha',weight:0,unit:'kg',sets:3,reps:60}]},
    // Persona 3 (Caro)
    {id:uid(),personaId:'p3',date:dOffset(5),muscles:['Espalda','Hombro'],cardio:{on:false},exercises:[
      {name:'Jalón al pecho',weight:45,unit:'kg',sets:4,reps:12},
      {name:'Press militar',weight:30,unit:'kg',sets:4,reps:10}]},
    {id:uid(),personaId:'p3',date:today(),muscles:['Espalda','Hombro'],cardio:{on:false},exercises:[
      {name:'Jalón al pecho',weight:52.5,unit:'kg',sets:4,reps:11},
      {name:'Press militar',weight:35,unit:'kg',sets:4,reps:10}]},
  ];

  const dishes = [
    {id:uid(),userId:u,name:'Pechuga de pollo',kcal:165,protein:31,carbs:0,fat:3.6,portion:100,unitType:'g'},
    {id:uid(),userId:u,name:'Arroz blanco cocido',kcal:130,protein:2.7,carbs:28,fat:0.3,portion:100,unitType:'g'},
    {id:uid(),userId:u,name:'Huevo entero',kcal:78,protein:6.3,carbs:0.6,fat:5.3,portion:1,unitType:'u'},
    {id:uid(),userId:u,name:'Avena',kcal:389,protein:16.9,carbs:66,fat:6.9,portion:100,unitType:'g'},
    {id:uid(),userId:u,name:'Whey protein (scoop)',kcal:120,protein:24,carbs:3,fat:1.5,portion:1,unitType:'u'},
  ];

  const weights = [
    {id:uid(),personaId:'p1',date:dOffset(21),weight:70.2},
    {id:uid(),personaId:'p1',date:dOffset(7),weight:69.4},
    {id:uid(),personaId:'p1',date:dOffset(1),weight:69.0},
    {id:uid(),personaId:'p2',date:dOffset(21),weight:82.5},
    {id:uid(),personaId:'p2',date:dOffset(7),weight:81.3},
    {id:uid(),personaId:'p2',date:dOffset(1),weight:80.6},
    {id:uid(),personaId:'p3',date:dOffset(14),weight:60.1},
    {id:uid(),personaId:'p3',date:dOffset(2),weight:60.8},
  ];

  const goals = {
    p1:{kcal:2000,protein:150,carbs:210,fat:60},
    p2:{kcal:2800,protein:190,carbs:300,fat:85},
    p3:{kcal:1800,protein:130,carbs:190,fat:55},
  };

  const meals = [
    {id:uid(),personaId:'p1',date:today(),items:[
      {dish:'Avena',portion:80,unitType:'g'},
      {dish:'Whey protein (scoop)',portion:1,unitType:'u'},
      {dish:'Pechuga de pollo',portion:200,unitType:'g'}]},
    {id:uid(),personaId:'p2',date:today(),items:[
      {dish:'Arroz blanco cocido',portion:250,unitType:'g'},
      {dish:'Pechuga de pollo',portion:250,unitType:'g'}]},
  ];

  return {
    users:[
      {id:u,   name:'Admin', email:'demo@zebbetag.com', pass:'demo', admin:true},
      {id:'p1',name:'Ana',   email:'ana@zebbetag.com',  pass:'ana',  admin:false},
      {id:'p2',name:'Beto',  email:'beto@zebbetag.com', pass:'beto', admin:false},
      {id:'p3',name:'Caro',  email:'caro@zebbetag.com', pass:'caro', admin:false},
    ],
    session:{currentUserId:null},
    exercises:exLib, workouts, dishes, weights, goals, meals
  };
}

db = loadDB();
if(!db){ db = seed(); saveLocal(); }
migrateDB();
function migrateDB(){
  let changed = false;
  const fresh = seed();
  // Esquema viejo con db.personas -> convertir a cuentas con rol
  if(db.personas){ delete db.personas; changed = true; }
  // Asegurar campo admin y que existan las cuentas base
  if(db.users){
    db.users.forEach(u=>{ if(typeof u.admin==='undefined') u.admin = (u.email==='demo@zebbetag.com'); });
    fresh.users.forEach(fu=>{ if(!db.users.some(u=>u.id===fu.id)){ db.users.push(fu); changed = true; } });
  } else { db.users = fresh.users; changed = true; }
  // Remapear datos antiguos (userId) a personaId si hiciera falta
  (db.workouts||[]).forEach(w=>{ if(!w.personaId){ w.personaId = w.userId || 'p1'; changed = true; } });
  (db.weights||[]).forEach(w=>{ if(!w.personaId){ w.personaId = w.userId || 'p1'; changed = true; } });
  (db.meals||[]).forEach(m=>{ if(!m.personaId){ m.personaId = m.userId || 'p1'; changed = true; } });
  if(db.feed){ delete db.feed; changed = true; }
  if(changed) saveLocal();
}

/* ---------- helpers de datos y roles ---------- */
const CU = () => db.session.currentUserId;
function curUser(){ return db.users.find(u=>u.id===CU()) || null; }
function isAdmin(){ const u=curUser(); return !!(u && u.admin); }
function managed(){ return isAdmin() ? db.users.filter(u=>!u.admin) : (curUser()?[curUser()]:[]); }
function canEdit(id){ return isAdmin() || id===CU(); }

let activePersona = null;
function AP(){
  if(isAdmin()){
    if(activePersona && managed().some(p=>p.id===activePersona)) return activePersona;
    return managed()[0] ? managed()[0].id : null;
  }
  return CU();
}
function personaName(id){ const u=db.users.find(x=>x.id===id); return u ? u.name : '—'; }

const myEx = () => db.exercises;                 // biblioteca de ejercicios (compartida)
const myDishes = () => db.dishes;                // biblioteca de platillos (compartida)
const myWorkouts = (pid=AP()) => db.workouts.filter(w=>w.personaId===pid).sort((a,b)=>a.date<b.date?-1:1);
const myWeights = (pid=AP()) => db.weights.filter(w=>w.personaId===pid).sort((a,b)=>a.date<b.date?-1:1);
const myGoals = (pid=AP()) => db.goals[pid] || {kcal:2000,protein:150,carbs:220,fat:60};
const escapeHtml = s => (s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getTodayWorkout(pid=AP()){
  let w = db.workouts.find(x=>x.personaId===pid && x.date===today());
  if(!w){ w = {id:uid(),personaId:pid,date:today(),muscles:[],exercises:[],cardio:{on:false}}; db.workouts.push(w); saveDB(); }
  return w;
}
function getTodayMeal(pid=AP()){
  let m = db.meals.find(x=>x.personaId===pid && x.date===today());
  if(!m){ m = {id:uid(),personaId:pid,date:today(),items:[]}; db.meals.push(m); saveDB(); }
  return m;
}
function volume(w){ return w.exercises.reduce((s,e)=>s+(e.weight||0)*(e.sets||0)*(e.reps||0),0); }

/* ---------- Selector de persona (solo administrador) ---------- */
function personaBar(){
  if(!isAdmin()) return '';   // los usuarios normales solo se gestionan a sí mismos
  return `<div class="glass rounded-2xl p-2 mb-4 flex items-center gap-2 overflow-x-auto">
    <span class="text-xs shrink-0 ml-1 mr-1" style="color:var(--txt-2)">Registrar para:</span>
    ${managed().map(p=>`<button class="chip shrink-0 ${p.id===AP()?'active':''}" onclick="setPersona('${p.id}')">${escapeHtml(p.name)}</button>`).join('')}
    <button class="btn-ghost rounded-xl w-9 h-9 flex items-center justify-center ml-auto shrink-0" onclick="openPersonas()" title="Editar nombres">✎</button>
  </div>`;
}
function setPersona(id){
  if(!isAdmin()) return;
  activePersona = id;
  if(section==='train') renderTrain();
  else if(section==='nutri') renderNutri();
  else if(section==='ctrl') renderCtrl();
}
function openPersonas(){
  if(!isAdmin()) return;
  showModal(`
    <h3 class="text-lg font-bold mb-1">Cuentas gestionadas</h3>
    <p class="text-xs mb-3" style="color:var(--txt-2)">Nombres de las personas que administras.</p>
    ${managed().map((p,i)=>`<label class="fld">${escapeHtml(p.email)}</label><input id="pn-${p.id}" value="${escapeHtml(p.name)}" class="mb-2">`).join('')}
    <button class="btn-accent w-full rounded-2xl py-2.5 mt-1" onclick="savePersonas()">Guardar</button>
    <button class="btn-ghost w-full rounded-2xl py-2.5 mt-2" onclick="closeModal()">Cancelar</button>
  `);
}
function savePersonas(){
  managed().forEach(p=>{ const el=document.getElementById('pn-'+p.id); if(el && el.value.trim()) p.name=el.value.trim(); });
  saveDB(); closeModal(); go(section);

/* ============================================================
   NUBE: sincronización vía GitHub API + respaldo localStorage
   ------------------------------------------------------------
   - Leer feed compartido: solo requiere usuario/repo (raw público).
   - Escribir: requiere token (fine-grained, solo Contents de ESE repo).
   - NUNCA se suben contraseñas ni correos al database.json.
   ============================================================ */
const CFG_KEY = 'zebbetag_cfg';
// Config base opcional: si rellenas owner/repo aquí, TODOS los usuarios leen el archivo
// central automáticamente (solo lectura, sin token). El token de escritura lo pone el admin.
// Config base. Con un Worker de Cloudflare, el token vive en el servidor (NUNCA aquí):
//   - workerUrl: URL de tu Worker (ej. https://zebbetagfit.tuusuario.workers.dev)
//   - appKey: clave simple que el Worker exige para escribir (evita abuso casual)
// Si dejas workerUrl vacío, la app usa lectura pública por raw (owner/repo) como respaldo.
const DEFAULT_CLOUD = { owner:'zebbetag', repo:'zebbetagFIT', branch:'main', path:'database.json',
  workerUrl:'https://dry-bush-4b25.zebbetag.workers.dev', appKey:'zebbetagfitness' };
function cfgGet(){ let saved={}; try{ saved = JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }catch(e){} return Object.assign({}, DEFAULT_CLOUD, saved); }
function cfgSet(c){ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
function useWorker(){ return !!cfgGet().workerUrl; }
function cloudCanRead(){ const c=cfgGet(); return !!(c.workerUrl || (c.owner && c.repo)); }
function cloudCanWrite(){ const c=cfgGet(); return !!(c.workerUrl || (c.owner && c.repo && c.token)); }
function ghPath(){ return (cfgGet().path || 'database.json'); }
function ghBranch(){ return (cfgGet().branch || 'main'); }

/* Capa remota: usa el Worker si está configurado; si no, GitHub directo (token) o raw público. */
async function remoteGet(){
  const c = cfgGet();
  if(c.workerUrl){
    const r = await fetch(c.workerUrl.replace(/\/+$/,'') + '/db', { cache:'no-store' });
    if(!r.ok) throw new Error('Worker ' + r.status);
    const j = await r.json();
    return { data: j.data || null, sha: j.sha || null };
  }
  if(c.token) return await ghGetFile();
  return { data: await ghRawRead(), sha: null };
}
async function remotePut(payload){
  const c = cfgGet();
  if(c.workerUrl){
    const r = await fetch(c.workerUrl.replace(/\/+$/,'') + '/db', {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-App-Key': c.appKey || '' },
      body: JSON.stringify({ data: payload })
    });
    if(!r.ok) throw new Error('Worker ' + r.status + ' ' + (await r.text()));
    return await r.json();
  }
  const { sha } = await ghGetFile();
  return await ghPutFile(payload, sha);
}

function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str){ return decodeURIComponent(escape(atob((str||'').replace(/\n/g,'')))); }

async function ghGetFile(){
  const c = cfgGet();
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(ghPath())}?ref=${encodeURIComponent(ghBranch())}&t=${Date.now()}`;
  const headers = { 'Accept':'application/vnd.github+json' };
  if(c.token) headers['Authorization'] = 'Bearer ' + c.token;
  const r = await fetch(url, { headers, cache:'no-store' });
  if(r.status === 404) return { data:null, sha:null };
  if(!r.ok) throw new Error('GitHub ' + r.status);
  const j = await r.json();
  return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
}
async function ghRawRead(){
  const c = cfgGet();
  const url = `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${ghBranch()}/${ghPath()}?t=${Date.now()}`;
  const r = await fetch(url, { cache:'no-store' });
  if(!r.ok) return null;
  return await r.json();
}
async function ghPutFile(obj, sha){
  const c = cfgGet();
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encodeURIComponent(ghPath())}`;
  const body = { message:'zebbetag sync ' + new Date().toISOString(), content: b64encode(JSON.stringify(obj,null,2)), branch: ghBranch() };
  if(sha) body.sha = sha;
  const r = await fetch(url, { method:'PUT',
    headers:{ 'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'Content-Type':'application/json' },
    body: JSON.stringify(body) });
  if(!r.ok){ throw new Error('GitHub ' + r.status + ' ' + (await r.text())); }
  return await r.json();
}

/* Datos compartibles (sin cuentas/contraseñas; solo datos por persona + bibliotecas) */
function sharedFromDB(src){
  return {
    workouts: src.workouts, exercises: src.exercises,
    dishes: src.dishes, weights: src.weights, meals: src.meals, goals: src.goals
  };
}
function emptyShared(){ return { workouts:[], exercises:[], dishes:[], weights:[], meals:[], goals:{} }; }

/* Aplicar remoto: lo remoto MANDA en los datos por persona (así lo del admin surte
   efecto en los usuarios). Las bibliotecas se unen por id para no perder nada. */
function applyRemote(shared){
  if(!shared) return;
  ['workouts','weights','meals'].forEach(k=>{ if(shared[k]) db[k]=shared[k]; });
  ['exercises','dishes'].forEach(k=>{ if(shared[k]){ const m={}; (db[k]||[]).forEach(x=>m[x.id]=x); shared[k].forEach(x=>m[x.id]=x); db[k]=Object.values(m); } });
  if(shared.goals) db.goals = Object.assign({}, db.goals, shared.goals);
  saveLocal();
}

/* Merge para SUBIR: conservo del remoto lo de personas que NO puedo editar, y subo
   lo mío editable. Admin puede editar a todos; el usuario solo a sí mismo. */
function mergeForPush(remote){
  const base = remote || emptyShared();
  const perOwner = k => (base[k]||[]).filter(r=>!canEdit(r.personaId)).concat((db[k]||[]).filter(r=>canEdit(r.personaId)));
  const unionById = k => { const m={}; (base[k]||[]).forEach(x=>m[x.id]=x); (db[k]||[]).forEach(x=>m[x.id]=x); return Object.values(m); };
  const goals = Object.assign({}, base.goals||{});
  Object.keys(db.goals||{}).forEach(id=>{ if(canEdit(id)) goals[id]=db.goals[id]; });
  return { workouts:perOwner('workouts'), weights:perOwner('weights'), meals:perOwner('meals'),
           exercises:unionById('exercises'), dishes:unionById('dishes'), goals };
}

let pushTimer=null, pushing=false;
function scheduleCloudPush(){ if(!cloudCanWrite()) return; clearTimeout(pushTimer); pushTimer=setTimeout(cloudPush, 1500); }
async function cloudPush(){
  if(!cloudCanWrite() || pushing) return;
  pushing = true; setSyncStatus('sync','Sincronizando…');
  try{
    const { data:remote } = await remoteGet();
    const payload = mergeForPush(remote);
    await remotePut(payload);
    setSyncStatus('ok','En la nube');
  }catch(e){ console.error(e); setSyncStatus('err','Error de nube · local ok'); }
  finally{ pushing = false; }
}
async function cloudPull(){
  if(!cloudCanRead()) return false;
  setSyncStatus('sync','Cargando…');
  try{
    const { data } = await remoteGet();
    applyRemote(data);
    setSyncStatus(cloudCanWrite()?'ok':'read', cloudCanWrite()?'En la nube':'Lectura nube');
    if(document.getElementById('app') && !document.getElementById('app').classList.contains('hide')) go(section);
    return true;
  }catch(e){ console.error(e); setSyncStatus('err','Sin conexión · local'); return false; }
}

function setSyncStatus(state,label){
  const b = document.getElementById('sync-badge'); if(!b) return;
  const colors = { ok:'#34C759', read:'#FF9500', sync:'#FF9500', err:'#FF2D55', local:'#A1A1AA' };
  const dot = b.querySelector('.dot');
  dot.style.background = colors[state] || '#A1A1AA';
  dot.classList.toggle('dot-spin', state==='sync');
  b.querySelector('.lbl').textContent = label;
  b.classList.remove('hide');
}

function forceSync(){

  const s=$('#cf-status'); if(s){ s.style.color='var(--txt-2)'; s.textContent='Sincronizando…'; }

  const seq = cloudCanWrite() ? cloudPush().then(()=>cloudPull()) : cloudPull();

/* ----- Equipo: las 3 personas ----- */
function personaExComparison(pid){
  const ws = db.workouts.filter(w=>w.personaId===pid).sort((a,b)=>a.date<b.date?-1:1);
  const map = {};
  ws.forEach(w=> w.exercises.forEach(e=>{ (map[e.name]=map[e.name]||[]).push({date:w.date,e,muscles:w.muscles}); }));
  return Object.entries(map).map(([name,arr])=>{
    arr.sort((a,b)=>a.date<b.date?-1:1);
    const cur=arr[arr.length-1].e, prev=arr.length>1?arr[arr.length-2].e:null;
    return { name, prev:prev?{w:prev.weight,s:prev.sets,r:prev.reps}:null, cur:{w:cur.weight,s:cur.sets,r:cur.reps} };
  });
}
function renderTeam(){
  const cards = managed().map(p=>{
    const wToday = db.workouts.find(x=>x.personaId===p.id && x.date===today());
    const cmp = personaExComparison(p.id);
    const rows = cmp.length ? cmp.map(x=>{
      const prevVol = x.prev? x.prev.w*x.prev.s*x.prev.r : 0;
      const up = x.cur.w*x.cur.s*x.cur.r >= prevVol;
      return `
      <div class="glass rounded-2xl p-3">
        <div class="text-sm font-semibold mb-2">${escapeHtml(x.name)}</div>
        <div class="grid grid-cols-2 gap-3 text-center">

            <div class="font-bold">${x.prev? x.prev.w+' kg' : '—'}</div>
            <div class="text-xs" style="color:var(--txt-2)">${x.prev? x.prev.s+'×'+x.prev.r : 'primera vez'}</div>
          </div>
          <div class="rounded-xl py-2" style="background:linear-gradient(135deg,rgba(255,45,85,.18),rgba(255,149,0,.18))">
            <div class="text-[10px] uppercase" style="color:var(--txt-2)">Actual ${up?'▲':'▼'}</div>
            <div class="font-bold grad-text">${x.cur.w} kg</div>
            <div class="text-xs" style="color:var(--txt-2)">${x.cur.s}×${x.cur.r}</div>
          </div>
        </div>
      </div>`;
    }).join('') : `<p class="text-sm text-center py-3" style="color:var(--txt-2)">Sin registros todavía.</p>`;
    const todayChips = wToday && wToday.muscles.length
      ? wToday.muscles.map(m=>`<span class="chip active text-xs">${m}</span>`).join('')
      : `<span class="text-xs" style="color:var(--txt-2)">Sin rutina hoy</span>`;
    return `

        <div class="flex items-center gap-3 mb-3">
          <div class="grad w-10 h-10 rounded-full flex items-center justify-center font-bold">${escapeHtml(p.name[0]||'?')}</div>

        </div>
        <div class="space-y-2 mb-3">${rows}</div>
        <div class="grid grid-cols-2 gap-2">
          <button class="btn-ghost rounded-2xl py-2.5 text-sm" onclick="exportPersonaStatsPDF('${p.id}')">⬇ Estadísticas</button>
          <button class="btn-accent rounded-2xl py-2.5 text-sm" onclick="exportPersonaDayPDF('${p.id}','${today()}')">⬇ Rutina de hoy</button>
        </div>

  $('#train-body').innerHTML = `<div class="fade"><p class="text-sm mb-4" style="color:var(--txt-2)">Registros de las 3 personas — anterior vs. actual, con descargas por persona.</p>${cards}</div>`;

/* comparación anterior vs actual por ejercicio dentro de un grupo (persona activa) */
function compareByMuscle(muscle, pid=AP()){
  const ws = db.workouts.filter(w=>w.personaId===pid && w.muscles.includes(muscle));
  const map = {};
  ws.forEach(w=> w.exercises.forEach(e=>{
    (map[e.name] = map[e.name]||[]).push({date:w.date, e});
  }));
  return Object.entries(map).map(([name, arr])=>{
    arr.sort((a,b)=>a.date<b.date?-1:1);
    const cur = arr[arr.length-1].e;
    const prev = arr.length>1 ? arr[arr.length-2].e : null;
    return {name, prev, cur};
  });
}

   SECCIÓN: NUTRICIÓN
   ============================================================ */
function macrosOfMeal(m){
  const t={kcal:0,protein:0,carbs:0,fat:0};
  m.items.forEach(it=>{
    const d = myDishes().find(x=>x.name===it.dish); if(!d) return;
    const factor = d.unitType==='g' ? it.portion/100 : it.portion/(d.portion||1);
    t.kcal+=d.kcal*factor; t.protein+=d.protein*factor; t.carbs+=d.carbs*factor; t.fat+=d.fat*factor;
  });
  Object.keys(t).forEach(k=>t[k]=Math.round(t[k]*10)/10);
  return t;
}
function renderNutri(){
  const g = myGoals();
  const m = getTodayMeal();
  const tot = macrosOfMeal(m);
  const macro = (label,val,goal,unit)=>{
    const over = val>goal;
    const pct = goal? Math.min(100, Math.round(val/goal*100)) : 0;
    return `
      <div class="glass rounded-2xl p-3">
        <div class="flex justify-between items-baseline mb-1">
          <span class="text-xs uppercase" style="color:var(--txt-2)">${label}</span>
          <span class="font-bold ${over?'over':''}">${val}<span class="text-xs" style="color:var(--txt-2)">/${goal}${unit}</span></span>
        </div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%; ${over?'background:linear-gradient(90deg,#FF2D55,#FF2D55)':''}"></div></div>
      </div>`;
  };
  const items = m.items.map((it,i)=>{
    const d = myDishes().find(x=>x.name===it.dish);
    const mm = d ? macrosOfMeal({items:[it]}) : {kcal:0};
    return `<div class="glass rounded-xl p-2.5 flex items-center justify-between">
      <div><div class="text-sm font-medium">${escapeHtml(it.dish)}</div><div class="text-xs" style="color:var(--txt-2)">${it.portion}${it.unitType==='g'?' g':' u'} · ${mm.kcal} kcal</div></div>
      <button class="btn-ghost rounded-lg w-8 h-8" onclick="removeMealItem(${i})">✕</button>
    </div>`;
  }).join('') || `<p class="text-sm text-center py-3" style="color:var(--txt-2)">Sin platillos aún. Añade lo que consumas hoy.</p>`;

  $('#content').innerHTML = `
    <div class="fade">
      ${personaBar()}
      <div class="glass-strong rounded-3xl p-5 mb-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold">Requerimientos · ${escapeHtml(personaName(AP()))}</h3>
          <button class="btn-ghost rounded-xl px-3 py-1.5 text-sm" onclick="openGoals()">Editar</button>
        </div>
        <div class="grid grid-cols-2 gap-3">
          ${macro('Calorías',tot.kcal,g.kcal,' kcal')}
          ${macro('Proteína',tot.protein,g.protein,' g')}
          ${macro('Carbohidratos',tot.carbs,g.carbs,' g')}
          ${macro('Grasas',tot.fat,g.fat,' g')}
        </div>
      </div>

      <div class="glass-strong rounded-3xl p-5 mb-4">
        <div class="flex items-center justify-between mb-3">
          <div><div class="text-xs uppercase" style="color:var(--txt-2)">Tarjeta de consumo · hoy</div><h3 class="font-bold">Comidas del día</h3></div>
          <button class="btn-accent rounded-xl px-3 py-1.5 text-sm" onclick="openAddMealItem()">+ Platillo</button>
        </div>
        <div class="space-y-2">${items}</div>
      </div>

      <button class="btn-ghost w-full rounded-2xl py-3" onclick="openDishRegistry()">📋 Registro de platillos predeterminados</button>
    </div>`;
}

const CH = {
  grid:'rgba(255,255,255,.08)', tick:'#A1A1AA',
  red:'#FF2D55', orange:'#FF9500'
};
function gradient(ctx,area,c1,c2){
  const g=ctx.createLinearGradient(0,area.top,0,area.bottom);
  g.addColorStop(0,c1); g.addColorStop(1,c2); return g;
}
function baseOpts(extra={}){
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ color:CH.tick } } },
    scales:{
      x:{ grid:{ color:CH.grid }, ticks:{ color:CH.tick } },
      y:{ grid:{ color:CH.grid }, ticks:{ color:CH.tick } }
    }
  }, extra);
}
function drawCharts(){
  destroyCharts();
  const ws = myWeights();
  // peso
  const wc = $('#c-weight').getContext('2d');
  charts.weight = new Chart(wc,{ type:'line',
    data:{ labels:ws.map(w=>fmtDate(w.date)), datasets:[{ label:'Peso (kg)', data:ws.map(w=>w.weight),
      borderColor:CH.red, borderWidth:3, tension:.4, pointBackgroundColor:CH.orange, pointRadius:4, fill:true,
      backgroundColor:(c)=>{ const a=c.chart.chartArea; return a?gradient(c.chart.ctx,a,'rgba(255,45,85,.35)','rgba(255,45,85,0)'):'transparent'; } }] },
    options:baseOpts({plugins:{legend:{display:false}}}) });
  // volumen
  const workouts = myWorkouts();
  const vc = $('#c-vol').getContext('2d');
  charts.vol = new Chart(vc,{ type:'bar',
    data:{ labels:workouts.map(w=>fmtDate(w.date)), datasets:[{ label:'Volumen (kg)', data:workouts.map(volume),
      borderRadius:8, backgroundColor:(c)=>{ const a=c.chart.chartArea; return a?gradient(c.chart.ctx,a,'#FF9500','#FF2D55'):'#FF2D55'; } }] },
    options:baseOpts({plugins:{legend:{display:false}}}) });
  // nutrición
  const g=myGoals(); const t=macrosOfMeal(getTodayMeal());
  const nc = $('#c-nutri').getContext('2d');
  charts.nutri = new Chart(nc,{ type:'bar',
    data:{ labels:['Calorías','Proteína','Carbos','Grasas'],
      datasets:[
        { label:'Consumido', data:[t.kcal,t.protein,t.carbs,t.fat], backgroundColor:CH.red, borderRadius:6 },
        { label:'Meta', data:[g.kcal,g.protein,g.carbs,g.fat], backgroundColor:'rgba(255,149,0,.55)', borderRadius:6 }
      ] },
    options:baseOpts() });
}

      <div style="text-align:right;color:#A1A1AA;font-size:12px;">${new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'})}</div>
    </div>
    <h1 style="font-size:26px;margin:0 0 20px;background:linear-gradient(90deg,#FF2D55,#FF9500);-webkit-background-clip:text;background-clip:text;color:transparent;">${title}</h1>
    ${inner}
    <div style="margin-top:30px;text-align:center;color:#4b4b52;font-size:11px;">Generado por zebbetag Fitness · Entrena. Registra. Progresa.</div>
  </div>`;
}
function cmpTable(rows){
  return `
  <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:13px;">
    <thead><tr style="background:rgba(255,255,255,.06);">
      <th style="text-align:left;padding:10px;border-bottom:1px solid rgba(255,255,255,.15);">Ejercicio</th>
      <th style="text-align:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.15);color:#A1A1AA;">Anterior</th>
      <th style="text-align:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.15);">Actual</th>
      <th style="text-align:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.15);">Δ</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}
async function renderPDF(html, filename){
  const host=$('#report-host'); host.innerHTML=html;
  const node=host.firstElementChild;
  await new Promise(r=>setTimeout(r,120));
  const canvas=await html2canvas(node,{scale:2,backgroundColor:'#0B0B0C'});
  host.innerHTML='';
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF('p','mm','a4');
  const pw=pdf.internal.pageSize.getWidth();
  const ph=pdf.internal.pageSize.getHeight();
  const imgW=pw; const imgH=canvas.height*pw/canvas.width;
  let left=imgH, pos=0;
  const img=canvas.toDataURL('image/png');
  pdf.addImage(img,'PNG',0,pos,imgW,imgH);
  left-=ph;
  while(left>0){ pos=left-imgH; pdf.addPage(); pdf.addImage(img,'PNG',0,pos,imgW,imgH); left-=ph; }
  pdf.save(filename);
}
function exportMusclePDF(){
  const muscle=$('#pdf-muscle').value;
  const pid=AP();
  const cmp=compareByMuscle(muscle,pid);
  const rows=cmp.map(c=>{
    const pv=c.prev?c.prev.weight*c.prev.sets*c.prev.reps:0;
    const cv=c.cur.weight*c.cur.sets*c.cur.reps;
    const delta=pv?Math.round((cv-pv)/pv*100):null;
    const col=delta===null?'#A1A1AA':(delta>=0?'#FF9500':'#FF2D55');
    return `<tr>
      <td style="padding:10px;border-bottom:1px solid rgba(255,255,255,.08);">${escapeHtml(c.name)}</td>
      <td style="padding:10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);color:#A1A1AA;">${c.prev?`${c.prev.weight}${c.prev.unit} · ${c.prev.sets}×${c.prev.reps}`:'—'}</td>
      <td style="padding:10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);font-weight:700;">${c.cur.weight}${c.cur.unit} · ${c.cur.sets}×${c.cur.reps}</td>
      <td style="padding:10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);color:${col};font-weight:700;">${delta===null?'—':(delta>=0?'+':'')+delta+'%'}</td>
    </tr>`;
  }).join('');
  const inner = `<div style="margin-bottom:8px;color:#A1A1AA;font-size:13px;">Persona: <b style="color:#fff;">${escapeHtml(personaName(pid))}</b> · Grupo muscular: <b style="color:#fff;">${muscle}</b> · Anterior vs. Actual</div>${cmpTable(rows||'<tr><td style="padding:12px;color:#A1A1AA;">Sin datos.</td></tr>')}`;
  renderPDF(reportShell('Reporte de Entrenamiento','Reporte por grupo muscular · '+personaName(pid),inner), `zebbetag_${personaName(pid)}_${muscle}.pdf`);
}
function exportPersonaStatsPDF(pid){
  pid = pid || AP();
  const ws=myWeights(pid); const workouts=myWorkouts(pid); const g=myGoals(pid); const t=macrosOfMeal(getTodayMeal(pid));
  const name=personaName(pid);
  const wDelta = ws.length>1 ? (ws[ws.length-1].weight-ws[0].weight).toFixed(1) : '0';
  const totVol = workouts.reduce((s,w)=>s+volume(w),0);
  const card=(l,v,c)=>`<div style="flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;">
    <div style="font-size:12px;color:#A1A1AA;">${l}</div><div style="font-size:22px;font-weight:800;color:${c};">${v}</div></div>`;
  const nutriRow=(l,v,gg)=>{ const over=v>gg; return `<tr>
    <td style="padding:8px;border-bottom:1px solid rgba(255,255,255,.08);">${l}</td>
    <td style="padding:8px;text-align:right;border-bottom:1px solid rgba(255,255,255,.08);color:${over?'#FF2D55':'#fff'};font-weight:700;">${v}</td>
    <td style="padding:8px;text-align:right;border-bottom:1px solid rgba(255,255,255,.08);color:#A1A1AA;">${gg}</td></tr>`; };
  const inner=`
    <div style="display:flex;gap:12px;margin-bottom:24px;">
      ${card('Peso actual', (ws.length?ws[ws.length-1].weight:'—')+' kg', '#FF9500')}
      ${card('Cambio de peso', (wDelta>0?'+':'')+wDelta+' kg', wDelta<=0?'#FF9500':'#FF2D55')}
      ${card('Volumen total', totVol.toLocaleString('es-MX')+' kg', '#FF2D55')}
      ${card('Sesiones', workouts.length, '#FF9500')}
    </div>
    <h2 style="font-size:16px;margin:0 0 8px;">Adherencia nutricional (hoy)</h2>
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px;">
      <thead><tr style="color:#A1A1AA;"><th style="text-align:left;padding:8px;">Macro</th><th style="text-align:right;padding:8px;">Consumido</th><th style="text-align:right;padding:8px;">Meta</th></tr></thead>
      <tbody>${nutriRow('Calorías (kcal)',t.kcal,g.kcal)}${nutriRow('Proteína (g)',t.protein,g.protein)}${nutriRow('Carbohidratos (g)',t.carbs,g.carbs)}${nutriRow('Grasas (g)',t.fat,g.fat)}</tbody>
    </table>
    <h2 style="font-size:16px;margin:0 0 8px;">Historial de entrenamientos</h2>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="color:#A1A1AA;"><th style="text-align:left;padding:8px;">Fecha</th><th style="text-align:left;padding:8px;">Grupos</th><th style="text-align:right;padding:8px;">Volumen</th></tr></thead>
      <tbody>${workouts.map(w=>`<tr><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,.08);">${fmtDate(w.date)}</td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,.08);color:#A1A1AA;">${w.muscles.join(', ')||'—'}</td><td style="padding:8px;text-align:right;border-bottom:1px solid rgba(255,255,255,.08);font-weight:700;">${volume(w).toLocaleString('es-MX')} kg</td></tr>`).join('')||'<tr><td colspan="3" style="padding:12px;color:#A1A1AA;">Sin datos.</td></tr>'}</tbody>
    </table>`;
  renderPDF(reportShell('Estadísticas de '+name,'Reporte de progreso individual',inner), `zebbetag_${name}_estadisticas.pdf`);
}

function exportPersonaDayPDF(pid, date){
  pid = pid || AP(); date = date || today();
  const name = personaName(pid);
  const w = db.workouts.find(x=>x.personaId===pid && x.date===date);
  let inner;
  if(!w || !w.exercises.length){
    inner = `<div style="color:#A1A1AA;font-size:14px;padding:12px 0;">${escapeHtml(name)} no tiene rutina registrada el ${fmtDate(date)}.</div>`;
  } else {
    const chips = w.muscles.map(m=>`<span style="display:inline-block;padding:5px 12px;border-radius:999px;background:linear-gradient(135deg,#FF2D55,#FF9500);color:#fff;font-size:12px;font-weight:700;margin-right:6px;">${m}</span>`).join('');
    const rows = w.exercises.map((e,i)=>`<tr>
      <td style="padding:10px;border-bottom:1px solid rgba(255,255,255,.08);color:#A1A1AA;">${i+1}</td>
      <td style="padding:10px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600;">${escapeHtml(e.name)}</td>
      <td style="padding:10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);">${e.weight} ${e.unit}</td>
      <td style="padding:10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);">${e.sets}</td>
      <td style="padding:10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);">${e.reps}</td>
    </tr>`).join('');
    const cardio = w.cardio && w.cardio.on
      ? `<div style="margin-top:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;font-size:13px;">🏃 <b>Cardio:</b> ${w.cardio.machine} · ${w.cardio.time} min · inclinación ${w.cardio.incline} · nivel ${w.cardio.level}</div>`
      : '';
    inner = `
      <div style="margin-bottom:14px;">${chips}</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr style="background:rgba(255,255,255,.06);color:#A1A1AA;">
          <th style="text-align:left;padding:10px;">#</th><th style="text-align:left;padding:10px;">Ejercicio</th>
          <th style="text-align:center;padding:10px;">Peso</th><th style="text-align:center;padding:10px;">Series</th><th style="text-align:center;padding:10px;">Reps</th>
        </tr></thead><tbody>${rows}</tbody>
      </table>
      ${cardio}
      <div style="margin-top:18px;text-align:right;font-size:14px;">Volumen del día: <b style="color:#FF9500;">${volume(w).toLocaleString('es-MX')} kg</b></div>`;
  }
  const sub = name + ' · ' + fmtDate(date);
  renderPDF(reportShell('Rutina del día', sub, inner), `zebbetag_${name}_rutina_${date}.pdf`);
}
